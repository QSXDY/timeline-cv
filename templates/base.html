<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ info.name }} · {{ info.role }}</title>
<link rel="icon" href="{{ url_for('static', filename='logo.webp') | cdn }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=20260915l">
<script defer src="{{ url_for('static', filename='js/script.js') }}?v=20260915l"></script>
</head>
<body>

<nav class="bar">
  <ul>
    <li class="brand"><img src="{{ url_for('static', filename='logo.webp') | cdn }}" alt="logo" class="brand-logo">{{ info.name }}</li>
    {% for s in nav_items %}
    {% if s.key != 'system' and s.anchor %}
    <li><a href="#{{ s.anchor }}">{{ s.nav_label }}</a></li>
    {% endif %}
    {% endfor %}
  </ul>
</nav>

<main id="top">
{% block content %}{% endblock %}
</main>

<footer>
  <span>{{ info.name }} · {{ info.role }} · {{ info.email }}</span>
  <span>每条项目可点击展开配图 · <a onclick="window.print()" class="print-link">本页可直接打印为 PDF</a></span>
</footer>

</body>
</html>
